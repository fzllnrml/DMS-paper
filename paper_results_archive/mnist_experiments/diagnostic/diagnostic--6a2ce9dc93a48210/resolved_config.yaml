kind: search
checkpoint: runs/mnist/checkpoints/best.pt
model_seed: 42
search_seed: 0
initial_noise_seed: 0
device: mps
batch_size: 128
population_size: 8
ddim_steps: 20
initialization: ddim
methods:
- original
- ddim
- ddim_cluster
- final_refine
search:
  schedule:
    kind: explicit
    timesteps:
    - 50
    - 15
    - 0
  step_mode: l2
  alpha: 0.01
  steps_per_level: 2
  final_steps: 2
  final_t: 0
  final_step_scale: 0.1
  projection: clamp
  tolerance: 1.0e-06
  save_trajectory: true
  merge:
    metric: euclidean
    schedule: every_level
    selected_levels: []
    representative: mean
    radius_schedule: noise_scaled
    radius: 0.5
    coefficient: 0.8
    min_radius: 0.05
    noise_units: legacy_sigma
    legacy_t0_sigma: 0.01
    max_particles: 4096
evaluation:
  enabled: true
  data_root: data/mnist
  download: false
  evaluator_checkpoint: null
  require_evaluator: false
  knn_k: 5
  train_limit: 1024
  validation_limit: 64
  include_test: false
stability:
  enabled: false
  scales:
  - 0.005
  - 0.01
  directions: 4
  steps: 20
  alpha: 0.001
  step_mode: l2
  projection: clamp
  t: 0
  return_radius: 0.01
curvature:
  enabled: true
  directions: 2
  epsilon: 0.01
  t: 0
visualization:
  enabled: true
  max_images: 64
  trajectory_particles: 4
  merge_comparison: true
max_matched_samples: 10000
variant: diagnostic
suite_id: diagnostic--6a2ce9dc93a48210
