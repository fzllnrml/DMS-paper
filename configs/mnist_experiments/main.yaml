output_root: runs/mnist_experiments/main
defaults:
  device: mps
  evaluation:
    evaluator_checkpoint: runs/mnist_evaluator/best.pt
    require_evaluator: true
experiments:
- name: original_geometry
  config:
    methods:
    - original
    - ddim
    - ddim_cluster
    - final_refine
    - no_intermediate_merge
    - low_noise_only
    - matched_ddim
    - matched_cluster
    stability:
      enabled: true
    curvature:
      enabled: true
  grid:
    search_seed:
    - 0
    - 1
    - 2
